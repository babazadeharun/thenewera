<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c10"><title>NEW ERA — Bağlantı yoxdur</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#080c10;color:#f0f9fb;font-family:Arial,sans-serif;padding:24px}main{max-width:380px;border:1px solid #26353e;border-radius:24px;padding:32px;background:#10191f}small{letter-spacing:4px;color:#70d9e1}h1{font-size:28px;line-height:1.2;margin:28px 0 16px}p{line-height:1.7;color:#a7bac4}button{margin-top:16px;width:100%;padding:16px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#70d9e1;color:#081015;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}</style></head>
<body><main><small>NEW ERA</small><h1>İnternet bağlantısı yoxdur</h1><p>İdarəetmə panelinə daxil olmaq üçün internetə qoşulun və yenidən cəhd edin.</p><button id="retry" type="button">Yenidən cəhd et</button></main><script>document.getElementById('retry').addEventListener('click',function(){location.reload()});</script></body></html>
